name: Apply Model Z submission bundle

on:
  push:
    branches: [main]
    paths:
      - submission_bundle.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified submission bundle
        run: |
          echo "fa2ea7582ae3391e57ef54c08cfcb7fd48f1e1d579afdb7c7512711cba86465f  submission_bundle.zip" | sha256sum -c -
          unzip -o submission_bundle.zip
          rm submission_bundle.zip
          rm -f dase7506-mp2-submission-bundle.zip
          rm .github/workflows/apply-model-z-submission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Add frozen Model Z submission"
          git push
